{% extends "base.html" %}
{% block titulo %}{{ 'Editar projeto' if projeto else 'Novo projeto' }}{% endblock %}
{% block conteudo %}
  <h1>{{ 'Editar projeto' if projeto else 'Novo projeto' }}</h1>

  <form class="cartao formulario" method="post"
        action="{{ url_for('projetos.atualizar', projeto_id=projeto.id) if projeto else url_for('projetos.criar') }}">
    <label for="nome">Nome <span class="obrigatorio">*</span></label>
    <input id="nome" name="nome" type="text" maxlength="100" required autofocus
           value="{{ dados.get('nome', '') }}">

    <label for="descricao">Descrição <span class="opcional">(opcional)</span></label>
    <textarea id="descricao" name="descricao" rows="3" maxlength="500">{{ dados.get('descricao', '') }}</textarea>

    <div class="acoes">
      <button class="botao botao-principal" type="submit">{{ 'Salvar alterações' if projeto else 'Criar projeto' }}</button>
      <a class="botao" href="{{ url_for('projetos.detalhar', projeto_id=projeto.id) if projeto else url_for('projetos.listar') }}">Cancelar</a>
    </div>
  </form>
{% endblock %}
