{% extends "base.html" %}
{% block titulo %}Editar tarefa{% endblock %}
{% block conteudo %}
  <a class="voltar" href="{{ url_for('projetos.detalhar', projeto_id=tarefa.projeto_id) }}">← {{ tarefa.projeto.nome }}</a>
  <h1>Editar tarefa</h1>

  <form class="cartao formulario" method="post" action="{{ url_for('tarefas.atualizar', tarefa_id=tarefa.id) }}">
    <label for="titulo">Título <span class="obrigatorio">*</span></label>
    <input id="titulo" name="titulo" type="text" maxlength="150" required autofocus
           value="{{ dados.get('titulo', '') }}">

    <label for="prazo">Prazo <span class="opcional">(opcional)</span></label>
    <input id="prazo" name="prazo" type="date" value="{{ dados.get('prazo', '') }}">

    <div class="acoes">
      <button class="botao botao-principal" type="submit">Salvar alterações</button>
      <a class="botao" href="{{ url_for('projetos.detalhar', projeto_id=tarefa.projeto_id) }}">Cancelar</a>
    </div>
  </form>
{% endblock %}
