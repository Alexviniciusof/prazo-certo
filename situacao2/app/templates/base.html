<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}Prazo Certo{% endblock %} · Prazo Certo</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/estilo.css') }}">
</head>
<body>
  <header class="topo">
    <a class="marca" href="{{ url_for('projetos.listar') }}">Prazo Certo</a>
    <nav>
      <a href="{{ url_for('projetos.listar') }}">Projetos</a>
      <a href="{{ url_for('tarefas.atrasadas') }}">Atrasadas</a>
    </nav>
  </header>

  <main class="conteudo">
    <div id="mensagens" class="mensagens" aria-live="polite">
      {% for categoria, texto in get_flashed_messages(with_categories=true) %}
        <p class="mensagem mensagem-{{ categoria }}" role="status">{{ texto }}</p>
      {% endfor %}
      {% if erro %}
        <p class="mensagem mensagem-erro" role="alert">{{ erro }}</p>
      {% endif %}
    </div>

    {% block conteudo %}{% endblock %}
  </main>

  <script src="{{ url_for('static', filename='js/app.js') }}" defer></script>
</body>
</html>
