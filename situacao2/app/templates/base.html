<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}Prazo Certo{% endblock %} · Prazo Certo</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%228%22 fill=%22%230f766e%22/%3E%3Cpath d=%22M9 16.5l4.5 4.5L23 11.5%22 stroke=%22white%22 stroke-width=%223.2%22 fill=%22none%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22/%3E%3C/svg%3E">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/estilo.css') }}">
</head>
<body>
  <header class="topo">
    <a class="marca" href="{{ url_for('projetos.listar') }}">Prazo Certo</a>
    <nav>
      <a href="{{ url_for('projetos.listar') }}" class="{{ 'ativo' if request.blueprint == 'projetos' }}">Projetos</a>
      <a href="{{ url_for('tarefas.atrasadas') }}" class="{{ 'ativo' if request.endpoint == 'tarefas.atrasadas' }}">Atrasadas</a>
    </nav>
  </header>

  <main class="conteudo">
    <div id="mensagens" class="mensagens" aria-live="polite">
      {% for categoria, texto in get_flashed_messages(with_categories=true) %}
        <p class="mensagem mensagem-{{ categoria }}" role="status">{{ texto }}</p>
      {% endfor %}
      {% if erro %}
        <p class="mensagem mensagem-erro" role="alert">{{ erro }}</p>
      {% endif %}
    </div>

    {% block conteudo %}{% endblock %}
  </main>

  <footer class="rodape">
    Testando o sistema? <a href="{{ url_for('avaliacoes.formulario') }}">Conte como foi</a>
  </footer>

  <script src="{{ url_for('static', filename='js/app.js') }}" defer></script>
</body>
</html>
